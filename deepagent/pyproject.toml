[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent"
version = "0.1.0"
description = "Autonomous research agent framework using open-source LLMs, MCP, and transformers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    # LLM backends
    "transformers>=5.0.0",
    "torch>=2.3.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.49.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "llama-cpp-python>=0.3.16",

    # MCP
    "mcp>=1.0.0",

    # Memory
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Tools
    "duckduckgo-search>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "arxiv>=2.1.0",
    "huggingface-hub>=0.23.0",
    "requests>=2.31.0",
    "feedparser>=6.0.11",

    # UI & utilities
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0"
]
search = [
    "tavily-python>=0.5.0"
]

[project.scripts]
deepagent = "deepagent.main:main"

[tool.setuptools.packages.find]
where = ["."]